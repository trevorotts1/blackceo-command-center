name: Council approved nine portraits manifest

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/components/council/council-portrait-manifest.ts"
      - "tests/unit/council-approved-portrait-manifest.test.ts"
      - ".github/workflows/council-approved-portrait-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  approved-art-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify fail-closed approval provenance and all nine asset paths
        run: node --import tsx --test tests/unit/council-approved-portrait-manifest.test.ts
