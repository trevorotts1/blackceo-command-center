name: Council full illustrated portrait seats

on:
  pull_request:
    paths:
      - "src/components/council/AdvisorSeat.tsx"
      - "src/components/council/council-theme.css"
      - "tests/unit/council-portrait-seat-render.test.tsx"
      - ".github/workflows/council-portrait-seat-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-seats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run genuine nine-seat portrait/medallion rendering and existing room tests
        run: |
          npx vitest run --config vitest.component.config.ts tests/unit/council-portrait-seat-render.test.tsx tests/unit/council-room-render.test.tsx
