name: Council mobile and accessibility layout

on:
  pull_request:
    paths:
      - "src/components/council/CouncilRoom.tsx"
      - "src/components/council/council-room.css"
      - "tests/unit/council-mobile-layout-contract.test.ts"
      - "tests/unit/council-room-logic.test.ts"
      - ".github/workflows/council-mobile-responsive-contract.yml"
      - "tests/browser/council-frame-geometry.mjs"
      - "src/components/council/council-theme.css"
      - "vitest.component.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked project deps
        run: npm ci --no-audit --no-fund
      - name: Verify mobile layout contract and Council room unit tests
        run: |
          node --import tsx --test tests/unit/council-mobile-layout-contract.test.ts tests/unit/council-room-logic.test.ts
          npx vitest run --config vitest.component.config.ts tests/unit/council-room-render.test.tsx
      - name: Install browser for real layout regression
        run: npx playwright install --with-deps chromium
      - name: Verify Council browser geometry
        run: node tests/browser/council-frame-geometry.mjs
