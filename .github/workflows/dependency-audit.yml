name: Dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the exact reviewed dependency graph
        run: npm ci
      - name: Reject known advisories in production and development dependencies
        run: npm audit --audit-level=low
