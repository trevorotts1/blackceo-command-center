name: Council start receipt and run controls

on:
  pull_request:
    paths:
      - "src/lib/council/journey-client.ts"
      - "src/components/council/SessionDetail.tsx"
      - "tests/unit/council-journey-render.test.tsx"
      - ".github/workflows/council-run-start-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify actual typed Start admission and read-only support
        run: npx vitest run --config vitest.component.config.ts tests/unit/council-journey-render.test.tsx
