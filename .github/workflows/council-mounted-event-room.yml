name: Council mounted event-backed room

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/components/council/SessionDetail.tsx"
      - "src/components/council/CouncilLiveSession.tsx"
      - "src/components/council/council-session-client.ts"
      - "src/components/council/useCouncilLiveSession.ts"
      - "tests/unit/council-journey-render.test.tsx"
      - "tests/unit/council-session-ui-render.test.tsx"
      - ".github/workflows/council-mounted-event-room.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  real-room:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test mounted live room and snapshot-first lifecycle
        run: |
          npx vitest run --config vitest.component.config.ts tests/unit/council-journey-render.test.tsx tests/unit/council-session-ui-render.test.tsx
